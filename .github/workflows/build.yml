name: Build Android WebApp Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Web App Archive
        run: |
          zip -r streamix-tv-app.zip . -x "*.git*"

      - name: Upload WebApp Package
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-TV-WebPackage
          path: streamix-tv-app.zip
