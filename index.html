<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamix TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #fff; direction: rtl; }
        header { background: #1e293b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #38bdf8; border-bottom: 2px solid #334155; }
        .container { display: flex; flex-direction: column; height: calc(100vh - 60px); }
        .player-container { width: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; max-height: 350px; outline: none; }
        .channels-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { background: #1e293b; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; border: 1px solid #334155; }
        .channel-item:hover { background: #334155; border-color: #38bdf8; }
        .channel-name { font-size: 16px; font-weight: bold; }
        .play-icon { color: #38bdf8; font-size: 14px; }
    </style>
    <!-- مكتبة تشغيل بث HLS إذا لزم الأمر -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header>Streamix TV - البث المباشر</header>

    <div class="container">
        <!-- مشغل الفيديو -->
        <div class="player-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>

        <!-- قائمة القنوات -->
        <div class="channels-list" id="channelsList">
            <!-- سيتم تعبئة القنوات تلقائياً -->
        </div>
    </div>

    <script>
        // قائمة القنوات المباشرة الشغالة والمستقرة
        const channels = [
            {
                name: "القرآن الكريم (مكة المكرمة)",
                url: "https://vs-hls-push-ww-live.live.cf.cdntv.africa/makkah/hq/index.m3u8"
            },
            {
                name: "السنة النبوية (المدينة المنورة)",
                url: "https://vs-hls-push-ww-live.live.cf.cdntv.africa/madinah/hq/index.m3u8"
            },
            {
                name: "قناة الجزيرة الإخبارية",
                url: "https://live-hls-web-aje.getaj.net/AJE/03.m3u8"
            },
            {
                name: "فرانس 24 بالعربية",
                url: "https://f24hls-i.akamaihd.net/hls/live/221991/F24_AR_HLS/master.m3u8"
            },
            {
                name: "سكاي نيوز عربية",
                url: "https://skynewsarabia.live.net.ae/hls/live/2026131/snasa/index.m3u8"
            }
        ];

        const video = document.getElementById('videoPlayer');
        const listContainer = document.getElementById('channelsList');

        // دالة لتشغيل القناة المحددة
        function playChannel(url) {
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                video.src = url;
                video.play();
            }
        }

        // عرض القنوات في الواجهة
        function loadChannels() {
            listContainer.innerHTML = '';
            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `
                    <span class="channel-name">📺 ${channel.name}</span>
                    <span class="play-icon">▶ تشغيل</span>
                `;
                div.onclick = () => playChannel(channel.url);
                listContainer.appendChild(div);
            });

            // تشغيل أول قناة تلقائياً عند الفتح
            if(channels.length > 0) {
                playChannel(channels[0].url);
            }
        }

        // تنفيذ عرض القنوات عند تحميل الصفحة
        window.onload = loadChannels;
    </script>

</body>
</html>
